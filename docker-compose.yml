services:
  # 1. BANCO DE DADOS POSTGRESQL 16
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pontoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pontoflow123}
      POSTGRES_DB: ${DB_NAME:-pontoflow_db}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pontoflow} -d ${DB_NAME:-pontoflow_db} || pg_isready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - pontoflow-net

  # 2. BACKEND API (FASTIFY NODE.JS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      TZ: America/Sao_Paulo
      JWT_SECRET: ${JWT_SECRET:-pontoflow-vps-coolify-secret-key-2026}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:suporte@pontoflow.app}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      DATABASE_URL: postgresql://${DB_USER:-pontoflow}:${DB_PASSWORD:-pontoflow123}@postgres:5432/${DB_NAME:-pontoflow_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pontoflow}
      DB_PASSWORD: ${DB_PASSWORD:-pontoflow123}
      DB_NAME: ${DB_NAME:-pontoflow_db}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - pontoflow-net

  # 3. FRONTEND (REACT + VITE + NGINX ALPINE)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - pontoflow-net

volumes:
  postgres_data:
    name: pontoflow_postgres_data

networks:
  pontoflow-net:
    name: pontoflow_network
