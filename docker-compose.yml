services:
  # 1. BANCO DE DADOS POSTGRESQL 16
  postgres:
    image: postgres:16-alpine
    container_name: pontoflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pontoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pontoflow123}
      POSTGRES_DB: ${DB_NAME:-pontoflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pontoflow} -d ${DB_NAME:-pontoflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pontoflow-net

  # 2. BACKEND API (FASTIFY NODE.JS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pontoflow-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-pontoflow-vps-coolify-secret-key-2026}
      DATABASE_URL: postgresql://${DB_USER:-pontoflow}:${DB_PASSWORD:-pontoflow123}@postgres:5432/${DB_NAME:-pontoflow_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pontoflow}
      DB_PASSWORD: ${DB_PASSWORD:-pontoflow123}
      DB_NAME: ${DB_NAME:-pontoflow_db}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - pontoflow-net

  # 3. FRONTEND (REACT + VITE + NGINX ALPINE)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pontoflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - pontoflow-net

volumes:
  postgres_data:
    name: pontoflow_postgres_data

networks:
  pontoflow-net:
    name: pontoflow_network
